<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>База знаний</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Файлы</h2>
        <button id="refresh-btn" class="btn-icon" title="Обновить">↻</button>
      </div>
      
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Поиск...">
      </div>
      
      <div class="actions">
        <button id="new-file-btn" class="btn btn-primary">+ Новый файл</button>
      </div>
      
      <div class="file-list-container">
        <ul id="file-list" class="file-list"></ul>
      </div>
      
      <div class="tags-section">
        <h3>Теги</h3>
        <div id="tags-list" class="tags-list"></div>
      </div>
    </aside>
    
    <main class="editor-panel">
      <div class="editor-header">
        <div class="file-info">
          <span id="current-filename" class="current-filename">Файл не выбран</span>
        </div>
        <div class="editor-actions">
          <button id="rename-btn" class="btn btn-secondary" disabled>Переименовать</button>
          <button id="delete-btn" class="btn btn-danger" disabled>Удалить</button>
          <button id="save-btn" class="btn btn-primary" disabled>Сохранить</button>
        </div>
      </div>
      
      <div class="editor-wrapper">
        <textarea id="editor" class="editor" placeholder="Выберите файл для редактирования..." disabled></textarea>
      </div>
      
      <div class="status-bar">
        <span id="status-message"></span>
        <span id="status-tags"></span>
      </div>
    </main>
  </div>
  
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="btn-icon">×</button>
      </div>
      <div class="modal-body">
        <input type="text" id="modal-input" class="modal-input" placeholder="">
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn btn-secondary">Отмена</button>
        <button id="modal-confirm" class="btn btn-primary">ОК</button>
      </div>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
